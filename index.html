<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy.

      Ojo: esto es sólo la mitad de la politica. `frame-ancestors` y HSTS NO se pueden expresar
      en un meta tag, asi que el servidor estatico tiene que mandar los headers de
      docs/security-headers.md. El navegador aplica la INTERSECCION de las dos politicas.

      De esa interseccion dependen dos entradas de acá:
        - http://localhost:*  -> sólo para dev (VITE_API_BASE_URL sin setear cae a localhost:3000)
        - https://picsum.photos + https://fastly.picsum.photos -> imagenes de relleno de las
          publicaciones que crea `pnpm db:seed` en el backend (src/db/seed.ts). NO es contenido
          real. Hacen falta LOS DOS hosts: picsum responde un redirect a su CDN de Fastly, y CSP
          vuelve a chequear la URL destino del redirect contra la lista (no hereda el permiso
          del host original).
        - worker-src 'self' blob: -> el cliente HMR de Vite arma un Worker desde un blob: URL.
          Sin esta directiva el fallback es script-src (que no lista blob:) y la consola de dev
          se llena de errores. En prod no se crea ningun worker.
      Ninguna de las tres esta en el header de produccion, asi que en prod quedan bloqueadas.

      https://foro.clinicaparaempresas.com SI es prod: es el backend del foro
      (VITE_FORO_API_BASE_URL, ver src/features/foro/api/foroApiConfig.ts). Es un origen
      distinto de api.clinicaparaempresas.com y CSP no tiene wildcard implicito de subdominio,
      asi que necesita su propia entrada en connect-src, tambien en el header del servidor.

      static.cloudflareinsights.com + el hash sha256 en script-src, y cloudflareinsights.com en
      connect-src: NO es analytics nuestro, es telemetria propia del widget de Turnstile. Al
      inicializarse, api.js (challenges.cloudflare.com/turnstile/v0/api.js) carga
      static.cloudflareinsights.com/beacon.min.js y corre un inline script bootstrap como parte
      de su propia ejecucion — challenges.cloudflare.com solo cubre el iframe/render, no esto.
      Sin estas entradas el widget tira el error interno 600010 (ver TurnstileWidget.tsx) porque
      un recurso del que depende su chequeo client-side nunca carga. El hash corresponde al
      inline script que Cloudflare sirve HOY; si una futura version de api.js lo cambia, Chrome
      va a loguear el hash nuevo en la consola (mismo formato de error) — hay que actualizarlo aca.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com 'sha256-X4Q7l0jQBanO1gdBZXxyAGDmfwYUHLr2ctPe8fFsCaQ=';
        style-src 'self' 'unsafe-inline';
        img-src 'self' blob: data: https://clinicaparaempresas.com https://imagedelivery.net https://api.clinicaparaempresas.com http://localhost:* https://picsum.photos https://fastly.picsum.photos;
        media-src 'self' blob: https://api.clinicaparaempresas.com http://localhost:*;
        connect-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://cloudflareinsights.com https://imagedelivery.net https://upload.imagedelivery.net http://localhost:* https://api.clinicaparaempresas.com https://foro.clinicaparaempresas.com;
        frame-src 'self' https://challenges.cloudflare.com https://www.youtube-nocookie.com;
        worker-src 'self' blob:;
        font-src 'self' data:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/cpeTAB.jpeg" />

    <!-- SEO Meta Tags -->
    <title>CPE - Clínica Para Empresas</title>
    <meta name="description" content="CPE - Personas y Empresas. Especialistas en selección de personal, traspaso generacional, intervención directa y acompañamiento empresarial." />
    <meta name="keywords" content="CPE, clínica para empresas, selección de personal, traspaso generacional, intervención directa, acompañamiento empresarial" />
    <meta name="author" content="CPE" />

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://clinicaparaempresas.com/" />
    <meta property="og:title" content="CPE - Clínica Para Empresas" />
    <meta property="og:description" content="CPE - Personas y Empresas. Especialistas en selección de personal, traspaso generacional, intervención directa y acompañamiento empresarial." />
    <meta property="og:image" content="https://clinicaparaempresas.com/logo_upscaled.png" />

    <meta name="twitter:image" content="https://clinicaparaempresas.com/logo_upscaled.png" />
  </head>
