<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy.

      Ojo: esto es sólo la mitad de la politica. `frame-ancestors` y HSTS NO se pueden expresar
      en un meta tag, asi que el servidor estatico tiene que mandar los headers de
      docs/security-headers.md. El navegador aplica la INTERSECCION de las dos politicas.

      De esa interseccion dependen dos entradas de acá:
        - http://localhost:*  -> sólo para dev (VITE_API_BASE_URL sin setear cae a localhost:3000)
        - https://picsum.photos + https://fastly.picsum.photos -> imagenes de relleno de las
          publicaciones que crea `pnpm db:seed` en el backend (src/db/seed.ts). NO es contenido
          real. Hacen falta LOS DOS hosts: picsum responde un redirect a su CDN de Fastly, y CSP
          vuelve a chequear la URL destino del redirect contra la lista (no hereda el permiso
          del host original).
      Ninguna de las dos esta en el header de produccion, asi que en prod quedan bloqueadas.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://challenges.cloudflare.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' blob: data: https://clinicaparaempresas.com https://imagedelivery.net https://api.clinicaparaempresas.com http://localhost:* https://picsum.photos https://fastly.picsum.photos;
        media-src 'self' blob: https://api.clinicaparaempresas.com http://localhost:*;
        connect-src 'self' https://challenges.cloudflare.com https://imagedelivery.net https://upload.imagedelivery.net http://localhost:* https://api.clinicaparaempresas.com;
        frame-src 'self' https://challenges.cloudflare.com https://www.youtube-nocookie.com;
        font-src 'self' data:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/cpeTAB.jpeg" />

    <!-- SEO Meta Tags -->
    <title>CPE - Clínica Para Empresas</title>
    <meta name="description" content="CPE - Personas y Empresas. Especialistas en selección de personal, traspaso generacional, intervención directa y acompañamiento empresarial." />
    <meta name="keywords" content="CPE, clínica para empresas, selección de personal, traspaso generacional, intervención directa, acompañamiento empresarial" />
    <meta name="author" content="CPE" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://clinicaparaempresas.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clinicaparaempresas.com/" />
    <meta property="og:title" content="CPE - Clínica Para Empresas" />
    <meta property="og:description" content="CPE - Personas y Empresas. Especialistas en selección de personal, traspaso generacional, intervención directa y acompañamiento empresarial." />
    <meta property="og:image" content="https://clinicaparaempresas.com/logo_upscaled.png" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="CPE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CPE - Clínica Para Empresas" />
    <meta name="twitter:description" content="CPE - Personas y Empresas. Especialistas en selección de personal, traspaso generacional, intervención directa y acompañamiento empresarial." />
    <meta name="twitter:image" content="https://clinicaparaempresas.com/logo_upscaled.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/apps/main/main.tsx"></script>
  </body>
</html>
